<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RAMGuard</title>
  <style>
    /* CSS Custom Properties for Material Design 3 Theme */
    :root {
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Light Theme (Google Material 3) */
      --bg-base: #f8f9fa;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --border-color: #e0e0e0;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --text-muted: #70757a;
      
      --color-primary: #1a73e8;
      --color-primary-hover: #1557b0;
      --color-primary-glow: #e8f0fe;
      --btn-primary-text: #ffffff;
      
      --color-accent: #1e8e3e;
      --color-accent-glow: #e6f4ea;
      
      --shadow-main: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --transition: all 0.15s ease-in-out;
      
      /* Scrollbar Custom Colors */
      --scrollbar-thumb: rgba(26, 115, 232, 0.35);
      --scrollbar-thumb-hover: rgba(26, 115, 232, 0.6);
    }

    /* Dark Theme Override */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-base: #202124;
        --bg-surface: #292a2d;
        --bg-card: #292a2d;
        --border-color: #3c4043;
        --text-primary: #e8eaed;
        --text-secondary: #9aa0a6;
        --text-muted: #70757a;
        
        --color-primary: #8ab4f8;
        --color-primary-hover: #aecbfa;
        --color-primary-glow: rgba(138, 180, 248, 0.15);
        --btn-primary-text: #202124;
        
        --color-accent: #81c995;
        --color-accent-glow: rgba(129, 201, 149, 0.15);
        
        --shadow-main: 0 1px 3px 0 rgba(0,0,0,0.3), 0 1px 2px 0 rgba(0,0,0,0.2);
        
        /* Scrollbar Custom Colors */
        --scrollbar-thumb: rgba(248, 250, 252, 0.2);
        --scrollbar-thumb-hover: rgba(248, 250, 252, 0.35);
      }
    }

    /* Manual body overrides for manual toggle button support */
    body.light {
      --bg-base: #f8f9fa;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --border-color: #dadce0;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --text-muted: #70757a;
      --color-primary: #1a73e8;
      --color-primary-hover: #1557b0;
      --color-primary-glow: #e8f0fe;
      --btn-primary-text: #ffffff;
      --color-accent: #1e8e3e;
      --color-accent-glow: #e6f4ea;
      --shadow-main: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
      --scrollbar-thumb: rgba(26, 115, 232, 0.35);
      --scrollbar-thumb-hover: rgba(26, 115, 232, 0.6);
    }

    body.dark {
      --bg-base: #202124;
      --bg-surface: #292a2d;
      --bg-card: #292a2d;
      --border-color: #3c4043;
      --text-primary: #e8eaed;
      --text-secondary: #9aa0a6;
      --text-muted: #70757a;
      --color-primary: #8ab4f8;
      --color-primary-hover: #aecbfa;
      --color-primary-glow: rgba(138, 180, 248, 0.15);
      --btn-primary-text: #202124;
      --color-accent: #81c995;
      --color-accent-glow: rgba(129, 201, 149, 0.15);
      --shadow-main: 0 1px 3px 0 rgba(0,0,0,0.3), 0 1px 2px 0 rgba(0,0,0,0.2);
      --scrollbar-thumb: rgba(248, 250, 252, 0.2);
      --scrollbar-thumb-hover: rgba(248, 250, 252, 0.35);
    }

    /* Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 420px;
      height: 565px;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 13px;
      line-height: 1.5;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 16px 20px;
      transition: background-color 0.15s ease;
    }

    /* Header styling */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition);
    }

    .theme-toggle-btn:hover {
      background-color: var(--border-color);
      color: var(--text-primary);
    }

    .theme-icon {
      width: 18px;
      height: 18px;
    }

    /* Google Flat Navigation Tabs */
    .nav-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .nav-tab {
      flex: 1;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-family);
      text-align: center;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      position: relative;
      transition: var(--transition);
    }

    .nav-tab:hover {
      color: var(--text-primary);
    }

    .nav-tab.active {
      color: var(--color-primary);
      font-weight: 600;
    }

    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      background-color: var(--color-primary);
      border-top-left-radius: 3px;
      border-top-right-radius: 3px;
    }

    /* Content Area */
    .panes-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .tab-pane {
      display: none;
      height: 100%;
      flex-direction: column;
      animation: tabFadeIn 0.15s ease-out;
    }

    .tab-pane.active {
      display: flex;
    }

    #pane-status {
      overflow-y: auto;
      padding-right: 2px;
    }

    @keyframes tabFadeIn {
      from { opacity: 0; transform: translateY(1px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Dashboard Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 12px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: var(--transition);
    }

    .stat-card:hover {
      border-color: var(--color-primary);
    }

    .stat-val {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.1;
      letter-spacing: -0.4px;
    }

    .stat-lbl {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .stat-card.accent .stat-val {
      color: var(--color-accent);
    }

    .stat-card-total-ram {
      font-size: 11px;
      margin-top: 4px;
      border-top: 1px solid var(--border-color);
      padding-top: 4px;
      width: 100%;
      color: var(--text-secondary);
    }

    /* Google Pill Buttons */
    .btn-main {
      width: 100%;
      padding: 10px 24px;
      border: none;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-family);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      background-color: var(--color-primary);
      color: var(--btn-primary-text);
      margin-bottom: 12px;
      letter-spacing: 0.1px;
    }

    .btn-main:hover {
      background-color: var(--color-primary-hover);
      box-shadow: 0 1px 3px rgba(60,64,67,0.3);
    }

    .btn-main:active {
      background-color: var(--color-primary-hover);
    }

    .btn-main[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Session Summary Box */
    .session-summary-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .session-title {
      font-weight: 500;
      color: var(--text-primary);
      font-size: 12px;
    }

    .session-info {
      text-align: right;
      line-height: 1.3;
    }

    .session-tabs-count {
      font-weight: 500;
      color: var(--color-primary);
      font-size: 12px;
    }

    .session-ram-saved {
      font-size: 11px;
      color: var(--color-accent);
      font-weight: 500;
    }

    /* Settings Group (Google Cards) */
    .settings-group {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-lbl {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .settings-badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--color-primary);
      background-color: var(--color-primary-glow);
      padding: 2px 8px;
      border-radius: 100px;
    }

    .settings-badge.accent {
      color: var(--color-accent);
      background-color: var(--color-accent-glow);
    }

    /* Google Slider input */
    .slider-input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--border-color);
      outline: none;
      cursor: pointer;
    }

    .slider-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--color-primary);
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 1px 3px rgba(60,64,67,0.3);
    }

    .slider-input::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }

    /* Auto-complete Dropdown Input styling */
    .ignore-input-wrap {
      display: flex;
      gap: 8px;
      margin-top: 2px;
      position: relative;
    }

    .ignore-input-box {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 12px;
      outline: none;
      transition: var(--transition);
    }

    .ignore-input-box:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px var(--color-primary-glow);
      background: var(--bg-card);
    }

    .autocomplete-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-main);
      z-index: 1000;
      max-height: 120px;
      overflow-y: auto;
    }

    .autocomplete-item {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .autocomplete-item:hover, .autocomplete-item.active {
      background-color: var(--color-primary-glow);
      color: var(--color-primary);
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    /* List Layout styles */
    .list-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .list-header {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: none;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .scroll-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding-right: 2px;
    }

    /* Material Design Flat List Rows */
    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      background-color: transparent;
      gap: 12px;
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .tab-info-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 4px;
    }

    .tab-text-details {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .tab-title-text {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-meta-text {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Outline Pill Buttons */
    .wake-btn {
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 100px;
      border: 1px solid var(--border-color);
      background-color: transparent;
      color: var(--color-primary);
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font-family);
    }

    .wake-btn:hover {
      background-color: var(--color-primary-glow);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .remove-ignore-btn {
      color: var(--text-muted);
    }

    .remove-ignore-btn:hover {
      background-color: rgba(217, 83, 79, 0.08) !important;
      color: #d9534f !important;
      border-color: #d9534f !important;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 16px;
      color: var(--text-muted);
      flex: 1;
      gap: 4px;
    }

    .empty-title {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
    }

    /* Scrollbar Design */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }

    /* Snackbar (Toast style) */
    .toast {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: var(--shadow-main);
      border: 1px solid var(--border-color);
      z-index: 100;
      transition: opacity 0.15s, transform 0.15s;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-success {
      border-left: 4px solid var(--color-accent);
    }

    .toast-error {
      border-left: 4px solid #d9534f;
    }

    .footer-wrap {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
      font-size: 11px;
      text-align: center;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .footer-wrap a {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-wrap a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <img src="/icons/icon-48.png" class="logo-img" alt="Shield Logo">
      <span class="logo-text">RAMGuard</span>
    </div>
    <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Theme">
      <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <!-- Segmented Tab Navigation Control -->
  <div class="nav-tabs">
    <button class="nav-tab active" data-target="pane-status">Status</button>
    <button class="nav-tab" data-target="pane-sleeping">Sleeping</button>
    <button class="nav-tab" data-target="pane-history">History</button>
  </div>

  <!-- Content Panes Container -->
  <div class="panes-container">

    <!-- STATUS TAB PANE -->
    <div id="pane-status" class="tab-pane active">
      <!-- Status Cards -->
      <div class="stats-grid">
        <div class="stat-card" title="Open tabs currently active">
          <div class="stat-val" id="activeTabsCount">0</div>
          <div class="stat-lbl">Active Tabs</div>
        </div>
        <div class="stat-card" title="Tabs hibernated to save memory">
          <div class="stat-val" id="sleepingTabsCount">0</div>
          <div class="stat-lbl">Sleeping Tabs</div>
        </div>
        <div class="stat-card accent" id="ramSavedCard" title="Estimated RAM saved (80-120MB per tab)">
          <div class="stat-val" id="sessionSavedRAM">0 MB</div>
          <div class="stat-lbl">Session Saved</div>
          <div class="stat-card-total-ram" id="totalSavedRAM">Total: 0 MB</div>
        </div>
      </div>

      <!-- Action Button -->
      <button id="hibernateNowBtn" class="btn-main" title="Instantly hibernate background tabs">
        Hibernate Inactive Now
      </button>

      <!-- Today's Session Summary Box -->
      <div class="session-summary-box">
        <span class="session-title">Today's Session</span>
        <div class="session-info">
          <div id="sessionTabsCount" class="session-tabs-count">0 tabs hibernated</div>
          <div id="sessionRAMSavedToday" class="session-ram-saved">0 MB RAM saved</div>
        </div>
      </div>

      <!-- Settings Section (Inactivity Timeout) -->
      <div class="settings-group">
        <div class="settings-header">
          <span class="settings-lbl">Auto-Hibernate Idle Time</span>
          <span class="settings-badge" id="inactiveValue">1 min</span>
        </div>
        <input type="range" id="inactiveSlider" class="slider-input" min="1" max="30" step="1" value="1" title="Adjust inactivity time slider (1 to 30 minutes)">
      </div>

      <!-- Ignore List Settings Section -->
      <div class="settings-group" style="margin-top: 12px; margin-bottom: 8px;">
        <div class="settings-header">
          <span class="settings-lbl">Never Hibernate Sites</span>
          <span class="settings-badge accent" id="ignoreCountBadge">0 sites</span>
        </div>
        <div class="ignore-input-wrap">
          <div style="flex: 1; position: relative;">
            <input type="text" id="newIgnoreInput" class="ignore-input-box" placeholder="e.g., github.com" autocomplete="off">
            <div id="autocompleteDropdown" class="autocomplete-dropdown">
              <!-- suggestions dynamically inserted -->
            </div>
          </div>
          <button id="addIgnoreBtn" class="wake-btn" style="padding: 8px 16px;" title="Add domain to ignore list">Add</button>
        </div>
        <div id="ignoreListContainer" style="max-height: 105px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 2px; margin-top: 6px; border-top: 1px solid var(--border-color); padding-top: 6px;">
          <!-- Dynamic ignore list items -->
      </div>
    </div>

    <!-- SLEEPING TABS PANE -->
    <div id="pane-sleeping" class="tab-pane">
      <div class="list-container">
        <div class="list-header" style="gap: 6px;">
          <span>Sleeping Tabs</span>
          <div style="display: flex; gap: 4px;">
            <button id="wakeAllBtn" class="wake-btn" style="padding: 2px 8px; font-size: 10px;" title="Wake up all sleeping tabs globally">
              Wake All Global
            </button>
            <button id="wakeWindowBtn" class="wake-btn" style="padding: 2px 8px; font-size: 10px;" title="Wake up sleeping tabs in current window">
              Wake All in Window
            </button>
          </div>
        </div>
        <div id="sleepingTabsList" class="scroll-container">
          <!-- Dynamic sleeping tabs -->
        </div>
      </div>
    </div>

    <!-- HISTORY PANE -->
    <div id="pane-history" class="tab-pane">
      <div class="list-container">
        <div class="list-header">
          <span>Recent Hibernations</span>
          <button id="clearHistoryBtn" class="wake-btn" style="padding: 2px 8px; font-size: 10px;" title="Clear hibernation log">
            Clear Log
          </button>
        </div>
        <div id="historyTabsList" class="scroll-container">
          <!-- Dynamic history log -->
        </div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer-wrap">
    Made by Vignesh Prabhu<br>
    <a href="https://www.linkedin.com/in/vigneshprabhu11/" target="_blank">LinkedIn</a> • 
    <a href="https://github.com/vignesh05p" target="_blank">GitHub</a> • 
    <a href="https://x.com/prabhu_ai" target="_blank">X (Twitter)</a>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <span id="toastText">Action completed</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
